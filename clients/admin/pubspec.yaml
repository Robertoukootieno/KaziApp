name: kaziapp_admin
description: "KaziApp Admin Dashboard - System administration interface for managing the KaziApp agricultural platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  flutter_riverpod: ^2.5.1

  # HTTP & API
  http: ^1.2.2
  dio: ^5.7.0

  # State Management & Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts & Data Visualization
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^27.1.58
  syncfusion_flutter_datagrid: ^27.1.58
  syncfusion_flutter_core: ^27.1.58

  # UI Components
  data_table_2: ^2.5.15
  flutter_staggered_grid_view: ^0.7.0
  card_swiper: ^3.0.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  logger: ^2.4.0

  # File handling
  file_picker: ^8.1.2
  csv: ^6.0.0

  # Authentication & Security
  jwt_decoder: ^2.0.1
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
