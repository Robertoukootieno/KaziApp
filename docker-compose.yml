# KaziApp Docker Compose - Root Configuration
#
# NOTICE: The main Docker configuration has been moved to infrastructure/docker/
#
# To use the new structured Docker setup:
#
# 1. Navigate to the infrastructure/docker directory:
#    cd infrastructure/docker
#
# 2. Copy the environment template:
#    cp .env.example .env
#
# 3. Edit .env with your configuration
#
# 4. Start the development environment:
#    ./scripts/start-dev.sh
#
# 5. Or build all services:
#    ./scripts/build-all.sh
#
# For backward compatibility, this file includes the main databases:

version: '3.8'

services:
  # Quick start - databases only
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kaziapp
      POSTGRES_USER: kaziapp
      POSTGRES_PASSWORD: kaziapp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/databases/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kaziapp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaziapp"]
      interval: 30s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: kaziapp
      MONGO_INITDB_ROOT_PASSWORD: kaziapp_password
      MONGO_INITDB_DATABASE: kaziapp
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/docker/databases/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - kaziapp-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kaziapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  kaziapp-network:
    driver: bridge